name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
  push:
    tags:
      - 'v*'
concurrency:
  group: TagBot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  TagBot:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SSH key lets TagBot push version tags when triggered via @JuliaTagBot.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # v0.1.0 is GitHub-only; General Registry registration starts in v0.2.0.
          register: false
          # Release notes from CHANGELOG.md (section matching the tag version).
          changelog: true
