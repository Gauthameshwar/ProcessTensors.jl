name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    # Official TagBot trigger: JuliaTagBot comments after General registration,
    # or a manual workflow_dispatch. TagBot does not create GitHub Releases from
    # manually pushed tags; use the Release workflow for that path.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SSH deploy key so Documenter CI is triggered by tags TagBot creates.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # Keep false until ProcessTensors is in General; then set true so TagBot
          # can register subsequent versions automatically after Registrator.
          register: false
